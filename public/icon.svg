<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#1b212b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#6d5cf0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- 象限坐标系：圆 + 十字轴 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#acc)" stroke-width="22" opacity="0.95"/>
  <line x1="256" y1="106" x2="256" y2="406" stroke="url(#acc)" stroke-width="22" stroke-linecap="round"/>
  <line x1="106" y1="256" x2="406" y2="256" stroke="url(#acc)" stroke-width="22" stroke-linecap="round"/>
  <!-- 右上象限二次函数曲线 -->
  <path d="M 214 356 Q 262 120 372 146" fill="none" stroke="#4ade80" stroke-width="20" stroke-linecap="round"/>
  <!-- 原点 -->
  <circle cx="256" cy="256" r="26" fill="#4ade80"/>
